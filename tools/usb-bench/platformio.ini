[platformio]
default_envs = usb_bench
; Use PlatformIO's standard package paths to avoid Windows command-length limits.
; Build cache kept inside the ignored .pio folder.
cache_dir = .pio/cache

[env:usb_bench]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0
upload_speed = 460800
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = time
monitor_echo = yes
