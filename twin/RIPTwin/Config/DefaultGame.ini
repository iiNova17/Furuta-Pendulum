[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=RIP Twin
Description=Digital twin of the rotary inverted pendulum

; Packaging (twin/package_twin.ps1, Shipping build). The meshes and twin_geometry.json are read from disk by
; RipTwinActor (Content/RIP), so they are staged as loose files; the materials are found from C++ only, so their
; folder is always cooked; the start map is an engine template map, so it must be listed.
[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
UsePakFile=True
bShareMaterialShaderCode=True
+DirectoriesToAlwaysCook=(Path="/Game/RIP")
+DirectoriesToAlwaysStageAsNonUFS=(Path="RIP")
+MapsToCook=(FilePath="/Engine/Maps/Templates/Template_Default")
bIncludeDebugFiles=False
